<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Sem `maximum-scale`/`user-scalable=no`: bloquear o pizza-zoom é falha de
         acessibilidade (WCAG 1.4.4) e quem mais sofre é o cliente que precisa
         ampliar o endereço de entrega. `viewport-fit=cover` fica: é ele que
         libera a área sob o notch, tratada pelos utilitários `.pt-safe`. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- A cor é trocada por papel em `src/lib/appShell.ts`; esta é o padrão. -->
    <meta name="theme-color" content="#B91C1C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Os três manifestos (cliente/cozinha/entregador) saem deste mesmo HTML,
         então o <link rel="manifest"> é injetado em runtime pelo appShell. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/cliente-apple-touch-180.png" />
    <!-- Título NEUTRO de propósito. Cada loja tem o seu, e `applyShopBranding`
         o troca assim que as configurações chegam. Um nome próprio aqui faria a
         loja B piscar o nome da loja A na abertura — e o iOS usa este mesmo
         título como nome sob o ícone na tela de início. -->
    <title>Delivery</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%B2%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#F5F5F4] text-[#1C1917] font-sans antialiased selection:bg-[#B91C1C] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
