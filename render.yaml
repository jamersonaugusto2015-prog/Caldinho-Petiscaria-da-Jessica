# Render Blueprint — deploy automático do Caldinho Express
# Como usar: github -> New Blueprint -> selecione este repo (ou crie o serviço Web manualmente)
services:
  - type: web
    name: caldinhodajessica
    runtime: node
    plan: starter # disco persistente (banco SQLite + fotos). Grátis não suporta disco.
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      # Sem isto o app sobe em modo DESENVOLVIMENTO: o header x-shop-slug passa a
      # escolher a loja (atalho que não pode existir em produção).
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: TZ
        value: America/Recife
      - key: DATA_DIR
        value: /data
      # O slug da loja original TEM que bater com o domínio, senão o cliente leva
      # 404 e a loja fica no ar mas invisível. Para caldinhodajessica.onrender.com,
      # use caldinhodajessica. (A migração cria a loja com o slug provisório `loja`.)
      - key: DEFAULT_SHOP_SLUG
        value: caldinhodajessica
      # O domínio-base do multi-loja. Para o domínio do Render, use onrender.com
      # (aí caldinhodajessica.onrender.com -> loja "caldinhodajessica"). Com um
      # domínio próprio e wildcard, use seudominio.com.br e cada loja vira um
      # subdomínio (loja-x.seudominio.com.br).
      - key: SHOP_BASE_DOMAIN
        value: onrender.com
      - key: CORS_ORIGIN
        sync: false # preencha com https://caldinhodajessica.onrender.com
      - key: APP_URL
        sync: false
      - key: MP_CLIENT_ID
        sync: false
      - key: MP_CLIENT_SECRET
        sync: false
      - key: MP_REDIRECT_URI
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false # painel do Mercado Pago -> Webhooks -> assinatura secreta
      - key: BACKUP_SERVICE_ACCOUNT
        sync: false # JSON da service account; fica fora do disco que ela faz backup
      # Push: opcional. Vazio = o servidor gera o par no primeiro boot e o guarda
      # no banco. Nunca troque um par já em uso: invalida todos os inscritos.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
    disk:
      name: caldinho-data
      mountPath: /data
      sizeGB: 1
